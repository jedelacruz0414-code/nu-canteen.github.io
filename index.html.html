<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NU Baliwag Canteen — Table Reservation System</title>

  <!-- Google Font used throughout the interface. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --navy:#0B2A5B;
      --navy2:#123a76;
      --gold:#F0B323;
      --bg:#eef1f5;
      --card:#fff;
      --line:#e3e8ef;
      --txt:#152238;
      --mut:#6b7a90;
      --gr:#2e9e5b;
      --grb:#d9f0e1;
      --or:#f0b323;
      --orb:#fdf2d6;
      --rd:#d94b4b;
      --rdb:#fbe0e0;
      --r:14px;
      --sh:0 2px 10px rgba(11,42,91,.08);
    }
    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }
    body {
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--txt);
      -webkit-font-smoothing:antialiased;
    }
    button {
      font:inherit;
      cursor:pointer;
      border:0;
      background:none;
      color:inherit;
    }
    input,select,textarea {
      font:inherit;
      width:100%;
      padding:11px 13px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      color:var(--txt);
      outline:none;
    }
    input:focus,select:focus {
      border-color:var(--navy2);
    }
    #switch {
      position:fixed;
      right:14px;
      bottom:14px;
      z-index:99;
      background:var(--navy);
      color:#fff;
      border-radius:30px;
      padding:6px;
      display:flex;
      gap:4px;
      box-shadow:0 6px 20px rgba(0,0,0,.25);
    }
    #switch button {
      padding:8px 16px;
      border-radius:24px;
      font-size:13px;
      font-weight:600;
      opacity:.65;
    }
    #switch button.on {
      background:#fff;
      color:var(--navy);
      opacity:1;
    }
    /* ---------- student ---------- */
    .phone {
      width:390px;
      margin:24px auto;
      background:#fff;
      border-radius:26px;
      overflow:hidden;
      box-shadow:0 18px 50px rgba(11,42,91,.22);
      display:flex;
      flex-direction:column;
      height:820px;
      max-height:calc(100vh - 48px);
      position:relative;
    }
    .backdrop {
      position:absolute;
      inset:0;
      background:rgba(11,20,35,.4);
      z-index:20;
    }
    .drawer {
      position:absolute;
      top:0;
      bottom:0;
      left:0;
      width:76%;
      max-width:280px;
      background:#fff;
      z-index:21;
      padding:20px 14px;
      display:flex;
      flex-direction:column;
      box-shadow:8px 0 26px rgba(0,0,0,.18);
    }
    .dhead {
      display:flex;
      gap:10px;
      align-items:center;
      padding-bottom:16px;
      border-bottom:1px solid var(--line);
      margin-bottom:10px;
    }
    .drawer nav {
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .drawer nav button {
      padding:12px 10px;
      border-radius:9px;
      text-align:left;
      font-weight:600;
      font-size:13.5px;
      color:var(--txt);
    }
    .drawer nav button:hover {
      background:#f3f6fa;
    }
    .notifpanel {
      position:absolute;
      top:64px;
      right:12px;
      width:250px;
      max-height:340px;
      overflow-y:auto;
      background:#fff;
      border-radius:14px;
      box-shadow:0 12px 34px rgba(0,0,0,.2);
      z-index:21;
      padding:12px;
    }
    .nitem {
      display:flex;
      gap:9px;
      padding:9px 4px;
      border-bottom:1px solid var(--line);
    }
    .nitem:last-child {
      border:0;
    }
    .sbody {
      flex:1;
      overflow-y:auto;
      background:var(--bg);
      padding:14px;
    }
    .shead {
      background:var(--navy);
      color:#fff;
      padding:16px;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .shead h2 {
      font-size:16px;
      font-weight:600;
      flex:1;
      text-align:center;
    }
    .ic {
      width:34px;
      height:34px;
      border-radius:9px;
      display:grid;
      place-items:center;
      font-size:17px;
    }
    .shead .ic {
      background:rgba(255,255,255,.12);
    }
    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--sh);
      padding:16px;
      margin-bottom:14px;
    }
    .ttl {
      font-size:13px;
      font-weight:700;
      color:var(--mut);
      letter-spacing:.3px;
      margin-bottom:10px;
      text-transform:uppercase;
    }
    .btn {
      background:var(--navy);
      color:#fff;
      padding:13px;
      border-radius:11px;
      font-weight:700;
      width:100%;
      letter-spacing:.4px;
    }
    .btn.g {
      background:#fff;
      color:var(--navy);
      border:1px solid var(--navy);
    }
    .btn.d {
      background:#fff;
      color:var(--rd);
      border:1px solid var(--rd);
    }
    .btn.sm {
      width:auto;
      padding:8px 14px;
      font-size:12.5px;
      border-radius:9px;
      font-weight:600;
    }
    .row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .mut {
      color:var(--mut);
      font-size:12.5px;
    }
    .badge {
      font-size:11px;
      font-weight:700;
      padding:5px 10px;
      border-radius:20px;
      white-space:nowrap;
    }
    .b-g {
      background:var(--grb);
      color:var(--gr);
    }
    .b-o {
      background:var(--orb);
      color:#9a6b00;
    }
    .b-r {
      background:var(--rdb);
      color:var(--rd);
    }
    .b-n {
      background:#e8edf5;
      color:var(--navy);
    }
    .timer {
      font-size:34px;
      font-weight:800;
      color:var(--gr);
      letter-spacing:1px;
      text-align:center;
    }
    .qa {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }
    .qa div {
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px 6px;
      text-align:center;
      font-size:11.5px;
      font-weight:600;
      box-shadow:var(--sh);
    }
    .qa span {
      display:block;
      font-size:22px;
      margin-bottom:6px;
    }
    .bnav {
      display:flex;
      background:#fff;
      border-top:1px solid var(--line);
    }
    .bnav button {
      flex:1;
      padding:10px 0 12px;
      font-size:10.5px;
      color:var(--mut);
      font-weight:600;
    }
    .bnav button span {
      display:block;
      font-size:18px;
      margin-bottom:2px;
      filter:grayscale(1);
      opacity:.6;
    }
    .bnav button.on {
      color:var(--navy);
    }
    .bnav button.on span {
      filter:none;
      opacity:1;
    }
    .grid4 {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }
    .tbl {
      border-radius:10px;
      padding:14px 0;
      text-align:center;
      font-weight:800;
      font-size:15px;
      border:2px solid transparent;
      position:relative;
    }
    .tbl:before,.tbl:after {
      content:"";
      position:absolute;
      left:22%;
      right:22%;
      height:5px;
      border-radius:3px;
      background:inherit;
      filter:brightness(.9);
    }
    .tbl:before {
      top:-7px;
    }
    .tbl:after {
      bottom:-7px;
    }
    .t-av {
      background:#bfe8ca;
      color:#16643a;
    }
    .t-rs {
      background:#f7cf6b;
      color:#7a5600;
    }
    .t-oc {
      background:#f3a5a5;
      color:#8a1f1f;
    }
    .tbl.sel {
      border-color:var(--navy);
      box-shadow:0 0 0 3px rgba(11,42,91,.15);
    }
    .leg {
      display:flex;
      justify-content:center;
      gap:16px;
      font-size:12px;
      color:var(--mut);
      margin:4px 0 14px;
    }
    .dot {
      width:9px;
      height:9px;
      border-radius:50%;
      display:inline-block;
      margin-right:5px;
    }
    .chips {
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding-bottom:4px;
      margin-bottom:12px;
    }
    .chips button {
      padding:8px 16px;
      border-radius:20px;
      background:#fff;
      border:1px solid var(--line);
      font-size:12.5px;
      font-weight:600;
      white-space:nowrap;
    }
    .chips button.on {
      background:var(--navy);
      color:#fff;
      border-color:var(--navy);
    }
    .food {
      display:flex;
      gap:12px;
      align-items:center;
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      margin-bottom:10px;
      box-shadow:var(--sh);
    }
    .thumb {
      width:58px;
      height:58px;
      border-radius:10px;
      display:grid;
      place-items:center;
      font-size:27px;
      background:#f3f6fa;
      flex:none;
    }
    .qty {
      display:flex;
      align-items:center;
      gap:10px;
      background:#f3f6fa;
      border-radius:9px;
      padding:4px 8px;
      font-weight:700;
    }
    .qty button {
      font-size:16px;
      color:var(--navy);
      width:18px;
    }
    /* ---------- admin ---------- */
    .adm {
      display:grid;
      grid-template-columns:238px 1fr;
      min-height:100vh;
    }
    .side {
      background:var(--navy);
      color:#fff;
      padding:18px 12px;
      position:sticky;
      top:0;
      height:100vh;
      overflow-y:auto;
    }
    .brand {
      display:flex;
      gap:10px;
      align-items:center;
      padding:0 8px 16px;
      border-bottom:1px solid rgba(255,255,255,.14);
      margin-bottom:12px;
    }
    .crest {
      width:38px;
      height:38px;
      border-radius:9px;
      background:var(--gold);
      color:var(--navy);
      display:grid;
      place-items:center;
      font-weight:800;
      font-size:13px;
      flex:none;
    }
    .side button {
      display:flex;
      gap:10px;
      align-items:center;
      width:100%;
      padding:10px 12px;
      border-radius:9px;
      font-size:13.5px;
      color:#cfdaec;
      margin-bottom:2px;
    }
    .side button.on,.side button:hover {
      background:rgba(255,255,255,.12);
      color:#fff;
    }
    .main {
      padding:0 0 40px;
    }
    .topbar {
      background:#fff;
      border-bottom:1px solid var(--line);
      padding:16px 26px;
      display:flex;
      align-items:center;
      gap:16px;
      position:sticky;
      top:0;
      z-index:5;
    }
    .topbar h1 {
      font-size:19px;
      font-weight:700;
    }
    .topbar input {
      max-width:280px;
      margin-left:auto;
    }
    .wrap {
      padding:22px 26px;
    }
    .stats {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
      gap:14px;
      margin-bottom:18px;
    }
    .stat {
      background:#fff;
      border:1px solid var(--line);
      border-left:4px solid var(--navy);
      border-radius:12px;
      padding:14px 16px;
      box-shadow:var(--sh);
    }
    .stat b {
      display:block;
      font-size:25px;
      margin-top:4px;
    }
    .cols {
      display:grid;
      grid-template-columns:1.25fr 1fr;
      gap:16px;
      align-items:start;
    }
    table {
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }
    th {
      text-align:left;
      color:var(--mut);
      font-size:11.5px;
      text-transform:uppercase;
      letter-spacing:.4px;
      padding:9px 10px;
      border-bottom:1px solid var(--line);
    }
    td {
      padding:11px 10px;
      border-bottom:1px solid #f1f4f8;
    }
    tr:last-child td {
      border:0;
    }
    .bar {
      height:9px;
      border-radius:5px;
      background:#e8edf5;
      overflow:hidden;
      margin-top:6px;
    }
    .bar i {
      display:block;
      height:100%;
      background:var(--navy);
    }
    .gridc {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
      gap:14px;
    }
    .chart {
      display:flex;
      align-items:flex-end;
      gap:14px;
      height:180px;
      padding-top:10px;
    }
    .chart div {
      flex:1;
      background:linear-gradient(180deg,var(--navy2),var(--navy));
      border-radius:7px 7px 0 0;
      position:relative;
      text-align:center;
    }
    .chart div span {
      position:absolute;
      bottom:-20px;
      left:0;
      right:0;
      font-size:11px;
      color:var(--mut);
    }
    .chart div b {
      position:absolute;
      top:-19px;
      left:0;
      right:0;
      font-size:11px;
      color:var(--navy);
    }
    .frm {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:14px;
    }
    label {
      display:block;
      font-size:12px;
      font-weight:600;
      color:var(--mut);
      margin-bottom:5px;
    }
    .t-ds {
      background:#e4e7eb;
      color:#8a94a3;
    }
    .modalbg {
      position:fixed;
      inset:0;
      background:rgba(11,20,35,.5);
      z-index:90;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .modalbox {
      background:#fff;
      border-radius:16px;
      padding:22px;
      width:100%;
      max-width:420px;
      max-height:86vh;
      overflow-y:auto;
      box-shadow:0 20px 60px rgba(0,0,0,.3);
    }
    .modalbox h3 {
      font-size:16px;
      margin-bottom:14px;
    }
    .mrow {
      display:flex;
      gap:10px;
      margin-top:16px;
    }
    .mrow .btn {
      width:auto;
      flex:1;
    }
    @media(max-width:860px) {
    .adm {
        grid-template-columns:1fr;
      }
    .side {
        position:static;
        height:auto;
      }
    .cols {
        grid-template-columns:1fr;
      }
    }
    @media(max-width:430px) {
    .phone {
        width:100%;
        margin:0;
        border-radius:0;
        height:100vh;
        max-height:100vh;
      }
    }
  
    /* =========================================================
       Mobile responsive layout
       Automatically adapts the interface to smaller screens.
       ========================================================= */

    html {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-width: 0;
      overflow-x: hidden;
    }

    img,
    svg,
    video,
    canvas {
      max-width: 100%;
    }

    button,
    input,
    select,
    textarea {
      max-width: 100%;
    }

    .app,
    .shell,
    .main,
    .content,
    .page,
    .container {
      max-width: 100%;
    }

    /* Prevent fixed desktop widths from causing horizontal scrolling. */
    .table,
    .card,
    .panel,
    .modal,
    .drawer,
    .form-grid,
    .grid,
    .stats,
    .table-grid,
    .menu-grid {
      max-width: 100%;
    }

    @media (max-width: 768px) {
      body {
        font-size: 14px;
      }

      /* Make the main layout use the full phone width. */
      .app {
        width: 100%;
      }

      /* Stack common multi-column layouts on phones. */
      .grid,
      .stats,
      .form-grid,
      .table-grid,
      .menu-grid {
        grid-template-columns: 1fr !important;
      }

      /* Keep cards from becoming wider than the viewport. */
      .card,
      .panel,
      .section,
      .content-card {
        width: 100%;
        box-sizing: border-box;
      }

      /* Make wide tables scroll horizontally instead of breaking the page. */
      .table-wrap,
      .table-container,
      .data-table-wrap {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        min-width: 600px;
      }

      /* Improve modal sizing on small screens. */
      .modal,
      .modal-card,
      .modal-content {
        width: calc(100vw - 24px) !important;
        max-width: calc(100vw - 24px) !important;
        max-height: calc(100vh - 24px);
        box-sizing: border-box;
        overflow-y: auto;
      }

      /* Drawer should fit the phone width. */
      .drawer {
        width: min(320px, 85vw) !important;
        max-width: 85vw;
      }

      /* Header/navigation controls can wrap instead of overflowing. */
      header,
      nav,
      .topbar,
      .navbar,
      .header-actions,
      .toolbar,
      .actions {
        max-width: 100%;
      }

      .header-actions,
      .toolbar,
      .actions {
        flex-wrap: wrap;
      }

      /* Form fields should use the available width. */
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
      }

      /* Keep buttons usable while allowing rows to wrap. */
      .btn,
      button {
        box-sizing: border-box;
      }

      /* Prevent long text, IDs, and URLs from forcing horizontal scroll. */
      h1,
      h2,
      h3,
      h4,
      p,
      span,
      label,
      td,
      th {
        overflow-wrap: anywhere;
      }
    }

    @media (max-width: 480px) {
      body {
        font-size: 13px;
      }

      h1 {
        font-size: 1.45rem;
      }

      h2 {
        font-size: 1.25rem;
      }

      h3 {
        font-size: 1.05rem;
      }

      /* Reduce spacing slightly on very small phones. */
      .card,
      .panel {
        padding: 12px;
      }

      .toolbar,
      .actions {
        gap: 8px;
      }

      button,
      .btn {
        min-height: 40px;
      }
    }

  </style>
</head>

        }
        </label>`).join("")+'<button class="btn" style="margin-top:6px" onclick="saveSettings()">SAVE SETTINGS</button>')}</div>`;
      }
      return `<div class="adm"><aside class="side"><div class="brand"><div class="crest">NU</div><div><b style="font-size:13.5px">NU BALIWAG CANTEEN</b><div style="font-size:10px;color:#9fb3d1;letter-spacing:.6px">RESERVATION SYSTEM</div></div></div>
      ${NAV.map(n=>`<button class="${p==n[0]?'on':''}" onclick="S.apage='${n[0]}';r()">${
        n[1]
      }
      </button>`).join("")}
      <button onclick="go('alogin')" style="margin-top:10px;color:#ffb4b4">⎋ Logout</button></aside>
      <div class="main"><div class="topbar"><h1>${title}</h1><input placeholder="🔍  Search..."><button class="ic" style="background:#f3f6fa">🔔</button>
       <div style="display:flex;gap:9px;align-items:center"><div class="crest" style="background:var(--navy);color:#fff;width:34px;height:34px;font-size:12px">CO</div><div><b style="font-size:13px">Cafeteria Owner</b><div class="mut" style="font-size:11px">Administrator</div></div></div></div>
       <div class="wrap">${body}</div></div></div>${renderModal()}`;
    }
    const renderModal=()=>{
      const m=S.modal;
      if(!m)return"";
      const F=(label,key,type)=>`<div><label>${label}</label><input ${type?`type="${type}"`:''} value="${(m.f[key]??'').toString().replace(/"/g,'&quot;')}" oninput="mset('${key}',this.value)"></div>`;
      let inner="";
      if(m.type=='table'){
        inner=`<h3>${m.f.isNew?"Add New Table":"Edit Table "+m.f.origN}</h3><div class="frm">${F("Table number","n","number")}${F("Number of seats","seats","number")}${F("Location","loc")}</div>
      <div class="mrow"><button class="btn" onclick="saveTable()">Save</button><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Cancel</button></div>`;
      }
      else if(m.type=='food'){
        inner=`<h3>${m.f.isNew?"Add Food Item":"Edit "+m.f.n}</h3><div class="frm">${F("Food name","n")}${F("Price (₱)","p","number")}<div><label>Category</label><select onchange="mset('c',this.value)">${["Meals","Snacks","Drinks"].map(c=>`<option${
          m.f.c==c?' selected':''
        }
        >${
          c
        }
        </option>`).join("")}</select></div>${F("Icon (emoji)","e")}${F("Stock","s","number")}</div>
      <div class="mrow"><button class="btn" onclick="saveFood()">Save</button><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Cancel</button></div>`;
      }
      else if(m.type=='inv'){
        inner=`<h3>${m.f.isNew?"Add Inventory Item":"Edit "+m.f.origN}</h3><div class="frm">${F("Item name","n")}${F("Current stock","q","number")}${F("Unit","u")}${F("Minimum stock level","m","number")}</div>
      <div class="mrow"><button class="btn" onclick="saveInv()">Save</button><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Cancel</button></div>`;
      }
      else if(m.type=='resview'){
        const x=m.f;
        inner=`<h3>Reservation ${x.id}</h3>
      ${[["Student",x.n],["School ID",x.sid],["Table",x.t],["Seats",x.s],["Time",x.tm],["Check-in",x.ci],["Status",x.st]].map(r=>`<div class="row" style="margin-bottom:10px"><span class="mut">${
          r[0]
        }
        </span><b>${
          r[1]
        }
        </b></div>`).join("")}
      <div class="mrow"><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Close</button></div>`;
      }
      else if(m.type=='userview'){
        const u=m.f;
        inner=`<h3>${u.n}</h3>
      ${[["School ID",u.sid],["Email",u.em],["Reservations",u.res],["Orders",u.ord],["Status",u.active?"Active":"Disabled"]].map(r=>`<div class="row" style="margin-bottom:10px"><span class="mut">${
          r[0]
        }
        </span><b>${
          r[1]
        }
        </b></div>`).join("")}
      <div class="mrow"><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Close</button></div>`;
      }
      return `<div class="modalbg" onclick="if(event.target==this)closeModal()"><div class="modalbox">${inner}</div></div>`;
    };
    function r(){
      document.getElementById("app").innerHTML=S.role=='s'?student():admin()
    }
    setInterval(()=>{
      if(!S.timerStarted)return;
      if(S.left>0)S.left--;
      const t=document.getElementById("tm");
      if(t)t.textContent=fmt(S.left);
      if(S.left==0){
        const x=S.tables.find(t=>t.st=='oc');
        if(x)x.st='av'
      }
    },1000);
    r();
  </script>
</body>
</html>
